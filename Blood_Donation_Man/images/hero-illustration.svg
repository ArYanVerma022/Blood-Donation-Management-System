<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" rx="16" fill="#f0f7ff" />
  
  <!-- Subtle Background Pattern -->
  <g fill="#0d6efd" opacity="0.05">
    <circle cx="50" cy="50" r="30" />
    <circle cx="450" cy="80" r="40" />
    <circle cx="100" cy="300" r="25" />
    <circle cx="420" cy="280" r="35" />
  </g>
  
  <!-- Medical Heart & Blood Drop Container -->
  <circle cx="250" cy="175" r="100" fill="#ffffff" stroke="#e0e0e0" stroke-width="4" />
  
  <!-- Central Blood Drop -->
  <path d="M250,95 C250,95 190,175 190,205 C190,235 217,255 250,255 C283,255 310,235 310,205 C310,175 250,95 250,95 Z" fill="#dc3545" />
  <ellipse cx="232" cy="180" rx="14" ry="25" fill="#ffffff" opacity="0.3" transform="rotate(-20 232 180)" />

  <!-- Plus Sign Inside Drop -->
  <rect x="242" y="185" width="16" height="40" rx="3" fill="#ffffff" />
  <rect x="230" y="197" width="40" height="16" rx="3" fill="#ffffff" />
  
  <!-- Pulse Line Across -->
  <path d="M 40,175 L 140,175 L 160,135 L 180,215 L 200,165 L 210,175 L 290,175 L 300,150 L 315,195 L 330,175 L 460,175" fill="none" stroke="#0d6efd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Small Floating Accent Drops -->
  <path d="M120,80 C120,80 100,110 100,120 C100,130 109,138 120,138 C131,138 140,130 140,120 C140,110 120,80 120,80 Z" fill="#ff6b6b" opacity="0.8" />
  <path d="M380,220 C380,220 365,245 365,253 C365,261 372,267 380,267 C388,267 395,261 395,253 C395,245 380,220 380,220 Z" fill="#ff6b6b" opacity="0.8" />
</svg>
